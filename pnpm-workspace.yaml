packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@bufbuild/buf': false
  '@nestjs/core': true
  '@parcel/watcher': true
  '@swc/core': true
  cbor-extract: true
  duckdb: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
overrides:
  tar: ^7.5.13
  '@tootallnate/once': ^3.0.1
  esbuild: ^0.25.0
  postcss: ^8.5.10
  hono: ^4.12.18
  '@hono/node-server': ^1.19.13
  fast-xml-parser: ^5.7.0
  undici: ^7.24.0
  fast-uri: ^3.1.2
  # brace-expansion ReDoS (CVE-2025-5889): keep every consumer on a patched level.
  # Two layers — pnpm applies the more-specific selector, so the per-major carve-outs
  # win for minimatch while the blanket still covers anything else (incl. future
  # consumers / new minimatch majors):
  #   1. Blanket default: latest patched major (5.x).
  #   2. Carve-outs for the older minimatch majors, which do `require('brace-expansion')()`
  #      expecting the module to *be* the function. 5.x exposes a named `exports.expand`,
  #      so a blanket-only 5.x gives "TypeError: expand is not a function" (crashes `eslint`).
  #      Map each to a patched major whose export shape it expects:
  #      3.x→1.x, 5.x/9.x→2.x (function-export, patched), 10.x→5.x (named export, what it wants).
  brace-expansion: ^5.0.6
  'minimatch@3>brace-expansion': ^1.1.14
  'minimatch@5>brace-expansion': ^2.1.0
  'minimatch@9>brace-expansion': ^2.1.0
  'minimatch@10>brace-expansion': ^5.0.6
  devalue: ^5.8.1
  fast-xml-builder: ^1.1.7
  ip-address: ^10.1.1
  mermaid: ^11.15.0
